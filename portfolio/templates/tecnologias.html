{% extends "base.html" %}
{% block content %}
<h2>Tecnologias</h2>
{% for t in tecnologias %}
    <article>
        {% if t.logo %}<img src="{{ t.logo.url }}" width="50">{% endif %}
        <h3>{{ t.nome }} ({{ t.get_categoria_display }})</h3>
        <p>Nível: {{ t.nivel }}/10</p>
    </article>
{% empty %}
    <p>Sem tecnologias.</p>
{% endfor %}
{% endblock %}
